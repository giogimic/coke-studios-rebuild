<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>GoCoke</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #fff;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #fsBtn {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 16px;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 8px;
        font: 600 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        cursor: pointer;
        z-index: 10;
      }
      #fsBtn:active { transform: translateX(-50%) scale(0.98); }
      #fsBtn.hidden { display: none; }
      #log { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; padding: 8px; }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="760" height="520"></canvas>
    <button id="fsBtn" type="button" aria-label="Enter fullscreen">⛶ Fullscreen</button>
    <script src="wasm_exec.js"></script>
    <script>
      // Optional: Configure WebSocket bridge endpoint
      // If hosting WASM on decibel.fun but bridge elsewhere, set this:
      // window.bridgeEndpoint = "wss://your-bridge-server.com";
      
      // Configure SW1 (Base64-encoded screen name) and SW2 (session secret)
      // These will be passed to the WASM client automatically
      
      // Read SW1 (Base64-encoded screenName) and SW2 (authoritative session ticket) from URL or storage
      const urlParams = new URLSearchParams(window.location.search);
      let sw1 = urlParams.get('sw1');
      let sw2 = urlParams.get('sw2') || urlParams.get('sid');
      const user = urlParams.get('user') || urlParams.get('name') || urlParams.get('screenName');

      if (!sw1 && user) {
        try {
          sw1 = btoa(user);
        } catch (_) {}
      }
      if (!sw1) {
        try {
          const storedUser = localStorage.getItem('coke_user');
          if (storedUser) sw1 = btoa(storedUser);
        } catch (_) {}
      }

      if (!sw2) {
        try {
          sw2 = localStorage.getItem('coke_session') || sessionStorage.getItem('coke_session') || '';
        } catch (_) {}
      }

      window.sw1 = sw1 || "";
      window.sw2 = sw2 || "";

      console.log('[GoCoke] Session configured:', {
        screenName: (() => { try { return atob(sw1); } catch (_) { return sw1; } })(),
        sw1: window.sw1,
        sw2: window.sw2
      });
      
      const go = new Go();

      async function launchGameEngine() {
        const statusEl = document.createElement("div");
        statusEl.id = "engineStatus";
        statusEl.style.position = "fixed";
        statusEl.style.top = "50%";
        statusEl.style.left = "50%";
        statusEl.style.transform = "translate(-50%, -50%)";
        statusEl.style.background = "rgba(20, 20, 20, 0.9)";
        statusEl.style.color = "#FF2D2D";
        statusEl.style.padding = "20px 30px";
        statusEl.style.borderRadius = "8px";
        statusEl.style.fontFamily = "Verdana, sans-serif";
        statusEl.style.fontSize = "14px";
        statusEl.style.textAlign = "center";
        statusEl.style.zIndex = "9999";
        statusEl.innerHTML = "<div style='font-weight:bold;margin-bottom:8px;'>COKE STUDIOS ENGINE</div><div id='engineSub'>Initializing WebAssembly Client...</div>";
        document.body.appendChild(statusEl);

        try {
          let wasmModule;
          const subEl = document.getElementById("engineSub");
          if (subEl) subEl.textContent = "Loading 1:1 isometric engine (main.wasm)...";

          if (WebAssembly.instantiateStreaming) {
            try {
              wasmModule = await WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject);
            } catch (streamErr) {
              console.warn("instantiateStreaming failed, falling back to arrayBuffer:", streamErr);
              const resp = await fetch("main.wasm");
              const bytes = await resp.arrayBuffer();
              wasmModule = await WebAssembly.instantiate(bytes, go.importObject);
            }
          } else {
            const resp = await fetch("main.wasm");
            const bytes = await resp.arrayBuffer();
            wasmModule = await WebAssembly.instantiate(bytes, go.importObject);
          }

          if (statusEl.parentNode) statusEl.parentNode.removeChild(statusEl);
          await go.run(wasmModule.instance);
        } catch (err) {
          console.error("Failed to load WASM:", err);
          statusEl.style.color = "#FFF";
          statusEl.style.background = "#8B0000";
          statusEl.style.maxWidth = "80%";
          statusEl.innerHTML = `<div style="font-weight:bold;margin-bottom:8px;">Client Launch Error</div>
            <div style="font-size:12px;text-align:left;white-space:pre-wrap;font-family:monospace;">${String(err && err.stack ? err.stack : err)}</div>
            <div style="margin-top:12px;"><button onclick="location.reload()" style="color:#000;background:#ffcc00;border:none;padding:8px 16px;border-radius:4px;font-weight:bold;cursor:pointer;">Retry Loading Coke Studios &rarr;</button></div>`;
        }
      }
      launchGameEngine();
    </script>
    <script>
      (function () {
        const btn = document.getElementById('fsBtn');
        const isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints || 0) > 0;

        function inFullscreen() {
          return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function canRequestFullscreen() {
          const el = document.documentElement;
          return !!(el.requestFullscreen || el.webkitRequestFullscreen || document.body.requestFullscreen || document.body.webkitRequestFullscreen);
        }

        async function enterFullscreen() {
          const el = document.documentElement;
          try {
            if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          } catch (_) {}
          try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (_) {}
        }

        function updateBtn() {
          if (!isTouch || !canRequestFullscreen()) {
            btn.classList.add('hidden');
            return;
          }
          if (inFullscreen()) btn.classList.add('hidden');
          else btn.classList.remove('hidden');
        }

        btn.addEventListener('click', enterFullscreen);
        document.addEventListener('fullscreenchange', updateBtn);
        document.addEventListener('webkitfullscreenchange', updateBtn);
        window.addEventListener('orientationchange', updateBtn);
        window.addEventListener('resize', updateBtn);
        updateBtn();
      })();
    </script>
    <script>
      (function () {
        console.log('[touch-shim] enabled');
        let activeTarget = null;
        let lastPos = { x: 0, y: 0 };
        let startTime = 0;
        let moved = false;
        const MOVE_TOLERANCE_PX = 6;

        function synthesizeMouse(type, target, x, y) {
          if (!target) return;
          const ev = new MouseEvent(type, {
            bubbles: true,
            cancelable: true,
            view: window,
            clientX: x,
            clientY: y,
            screenX: x,
            screenY: y,
            button: 0,
            buttons: type === 'mouseup' ? 0 : 1
          });
          target.dispatchEvent(ev);
        }

        function onTouchStart(e) {
          if (e.touches.length !== 1) return;
          if (e.cancelable) e.preventDefault();
          const t = e.touches[0];
          const x = t.clientX;
          const y = t.clientY;
          lastPos.x = x;
          lastPos.y = y;
          startTime = Date.now();
          moved = false;
          activeTarget = document.elementFromPoint(x, y) || e.target;
          synthesizeMouse('mousemove', activeTarget, x, y);
          synthesizeMouse('mousedown', activeTarget, x, y);
        }

        function onTouchMove(e) {
          if (e.touches.length !== 1) return;
          if (e.cancelable) e.preventDefault();
          const t = e.touches[0];
          const x = t.clientX;
          const y = t.clientY;
          if (Math.abs(x - lastPos.x) > MOVE_TOLERANCE_PX || Math.abs(y - lastPos.y) > MOVE_TOLERANCE_PX) {
            moved = true;
          }
          lastPos.x = x;
          lastPos.y = y;
          const target = activeTarget || document.elementFromPoint(x, y) || e.target;
          synthesizeMouse('mousemove', target, x, y);
        }

        function onTouchEnd(e) {
          if (e.cancelable) e.preventDefault();
          const x = lastPos.x;
          const y = lastPos.y;
          const target = activeTarget || document.elementFromPoint(x, y) || e.target;
          synthesizeMouse('mouseup', target, x, y);
          const shortTap = Date.now() - startTime < 500 && !moved;
          if (shortTap) {
            const clickEv = new MouseEvent('click', {
              bubbles: true,
              cancelable: true,
              view: window,
              clientX: x,
              clientY: y,
              screenX: x,
              screenY: y,
              button: 0
            });
            target && target.dispatchEvent(clickEv);
          }
          activeTarget = null;
        }

        function onTouchCancel(e) {
          if (e.cancelable) e.preventDefault();
          activeTarget = null;
        }

        window.addEventListener('touchstart', onTouchStart, { passive: false });
        window.addEventListener('touchmove', onTouchMove, { passive: false });
        window.addEventListener('touchend', onTouchEnd, { passive: false });
        window.addEventListener('touchcancel', onTouchCancel, { passive: false });
      })();
    </script>
  </body>
  </html>
