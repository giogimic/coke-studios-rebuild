services:
  mariadb:
    image: mariadb:11
    container_name: coke-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-coke_root_secret}
      MYSQL_DATABASE: ${DB_NAME:-coke_studios}
      MYSQL_USER: ${DB_USER:-coke}
      MYSQL_PASSWORD: ${DB_PASS:-coke_secret}
    volumes:
      - coke_mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  coke-studios:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coke-studios-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${PORT:-24902}:${PORT:-24902}"                      # Official MyCoke Game Portal & Authoritative Server
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"        # Standalone Direct Port (optional)
    volumes:
      - .:/app
    environment:
      - HOST=0.0.0.0
      - PORT=${PORT:-24902}
      - BACKEND_PORT=${BACKEND_PORT:-8080}
      - DB_DRIVER=mysql
      - DATABASE_URL=${DATABASE_URL:-coke:coke_secret@tcp(mariadb:3306)/coke_studios?parseTime=true}

volumes:
  coke_mariadb_data:
    name: coke_mariadb_data
